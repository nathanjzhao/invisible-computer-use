[package]
name = "app_instructions"
version = "0.1.0"
edition = "2021"
description = "Codex/Sky parity: per-app instruction packs, first-touch <app_specific_instructions> injection (spec 04)."

[lib]
name = "app_instructions"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "app-instructions"
path = "src/bin/app_instructions.rs"
