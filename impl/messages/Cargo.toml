[workspace]

[package]
name = "icu-messages"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Standalone, consent-gated Messages integration"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks", "functions", "limits"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
getrandom = "0.4"
sha2 = "0.10"
crabstep = { version = "=0.7.0", features = ["foundation"] }
libc = "0.2"
fs2 = "0.4"
tempfile = "3"
iana-time-zone = "0.1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }

[dev-dependencies]
png = "0.18"

[profile.release]
strip = true
