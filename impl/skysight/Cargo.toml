[package]
name = "skysight"
version = "0.1.0"
edition = "2021"
description = "Codex Skysight parity: summarizer/memory prompts (verbatim), summary contract + validator, 10min/6h windows, resources store, sticky-taint rules (spec 03)."

[lib]
name = "skysight"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[[bin]]
name = "skysight"
path = "src/bin/skysight.rs"

[dev-dependencies]
tempfile = "3"
