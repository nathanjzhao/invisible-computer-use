[workspace]

[package]
name = "computer-history"
version = "0.1.0"
edition = "2021"
description = "Local Computer History observation policy, storage and controls"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
getrandom = "0.4"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", default-features = false, features = ["connection", "tokio", "zbus"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = "0.3"
x11rb = { version = "0.13", features = ["xinput", "xkb"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.61.2"
windows = {version="0.61.3",features=["Win32_Foundation","Win32_System_Com","Win32_System_Ole","Win32_System_Variant","Win32_UI_Accessibility"]}
windows-sys = {version="0.61",features=["Win32_Storage_FileSystem","Win32_System_StationsAndDesktops","Win32_System_RemoteDesktop","Win32_System_Threading","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_System_LibraryLoader"]}

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
